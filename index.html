<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franklin & Hudson</title>
    <style>
        /* Flexbox handles the perfect vertical and horizontal centering automatically */
        body {
            background-color: #121212; 
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .brand-name {
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: 0.45em;
            text-transform: uppercase;
            margin-bottom: 25px; /* Spacing below the main logo */
        }

        .info-line {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #888888;
            margin: 5px 0; /* Original 5px spacing for your mobile view */
            padding: 0 20px; /* Essential for mobile margins */
        }
    </style>
</head>
<body>

    <div class="brand-name">Franklin & Hudson</div>
    
    <div class="info-line">Website Under Development</div>
    <div class="info-line">Arriving Spring 2026</div>

</body>
</html>
