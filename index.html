<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franklin & Hudson Co.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        body {
            background-color: #FFFFFF;
            color: #333333;
            font-family: 'Libre Caslon Text', serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 3rem;
            font-weight: 700; 
            letter-spacing: -0.01em;
            margin-bottom: 1.5rem;
        }
        .status {
            font-style: italic;
            font-size: 1.2rem;
            opacity: 0.8;
            letter-spacing: 0.02em;
        }
        .footer {
            position: absolute;
            bottom: 2.5rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <h1>Franklin & Hudson Co.</h1>
    <p class="status">Website under development. Arriving Spring 2026.</p>
    <div class="footer">New York, NY</div>
</body>
</html>
